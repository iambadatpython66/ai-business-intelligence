name: Skill tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill metadata and resources
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./tests/test-skill.ps1
      - name: Test evidence, scoring, and report generation
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./tests/test-pipeline.ps1
